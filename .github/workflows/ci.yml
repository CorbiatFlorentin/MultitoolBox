name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: false

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # PHP + composer pour le test d'intégration TestPhpDemoIntegration
      # (ignoré localement si examples/demo-php/vendor est absent).
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer

      - name: Install examples/demo-php
        run: composer install --no-interaction --no-progress --working-dir=examples/demo-php

      - name: Test
        run: go test ./... -v

      - name: Check formatting (gofmt)
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Fichiers non formatés (gofmt -l):"
            echo "$unformatted"
            exit 1
          fi

  build-cross:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: windows
            goarch: amd64
            ext: ".exe"
          - goos: linux
            goarch: amd64
            ext: ""
          - goos: darwin
            goarch: amd64
            ext: ""
          - goos: darwin
            goarch: arm64
            ext: ""
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: false

      - name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -o dist/multitest-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }} .

      - uses: actions/upload-artifact@v4
        with:
          name: multitest-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*

  update-docs:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: false

      - name: Régénère la section "Usage" du README depuis multitest help
        run: |
          go build -o multitest .
          USAGE="$(./multitest help)"
          python3 - "$USAGE" <<'PY'
          import re, sys, pathlib

          usage = sys.argv[1]
          readme = pathlib.Path("README.md")
          text = readme.read_text()
          block = "<!-- usage:start -->\n```\n" + usage + "\n```\n<!-- usage:end -->"
          new_text = re.sub(
              r"<!-- usage:start -->\n```\n.*?\n```\n<!-- usage:end -->",
              block,
              text,
              flags=re.S,
          )
          readme.write_text(new_text)
          PY

      - name: Commit si le README a changé
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          if ! git diff --cached --quiet; then
            git commit -m "docs: régénère la section Usage du README [skip ci]"
            git push
          fi
